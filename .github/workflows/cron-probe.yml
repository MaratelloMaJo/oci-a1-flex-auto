name: cron-probe

# ВРЕМЕННЫЙ диагностический workflow: проверяет, срабатывает ли schedule
# на этом репозитории. Удалить после проверки.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Echo
        run: echo "probe fired at $(date -u +%FT%TZ)"
